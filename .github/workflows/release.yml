name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Build macOS (Intel + Apple Silicon) ─────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Build macOS DMG
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/*.dmg

  # ── Build Windows installer (.exe) ──────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: dist/*.exe

  # ── Publish GitHub Release with all artifacts ────────────────────────────
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Installation

            | Platform | File |
            |---|---|
            | macOS Apple Silicon | `WhatsSpace-*-arm64.dmg` |
            | macOS Intel | `WhatsSpace-*-x64.dmg` |
            | Windows | `WhatsSpace-Setup-*.exe` |

            ### macOS: "damaged and can't be opened"
            macOS blocks unsigned apps downloaded from the internet. Run this once in Terminal after installing:
            ```bash
            xattr -cr /Applications/WhatsSpace.app
            ```
            Or right-click the app → **Open** → **Open**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
